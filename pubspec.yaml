name: dice_roll
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.1.0
  flutter_launcher_icons: ^0.14.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  provider: ^6.1.5+1
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  mocktail: ^1.0.4
  widgetbook: ^3.23.0
  
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/launcher_icons/

  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_Regular.ttf
          weight: 400

flutter_launcher_icons:
  image_path: "assets/launcher_icons/icon.png"

  android: true
  image_path_android: "assets/launcher_icons/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "assets/launcher_icons/background.png"
  adaptive_icon_foreground: "assets/launcher_icons/foreground.png"
  adaptive_icon_foreground_inset: 16

  ios: true
  image_path_ios: "assets/launcher_icons/icon.png"
  remove_alpha_ios: true
  image_path_ios_dark_transparent: "assets/launcher_icons/icon.png"

  web: 
    generate: true
    image_path: "assets/launcher_icons/icon.png"
  macos: 
    generate: true
    image_path: "assets/launcher_icons/icon.png"
  windows: 
    generate: true
    image_path: "assets/launcher_icons/icon.png"
  linux: 
    generate: true
    image_path: "assets/launcher_icons/icon.png"